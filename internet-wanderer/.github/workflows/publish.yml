name: Publish Internet Wanderer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      content_mode:
        description: Content clock (Demo works with the bundled static sample)
        type: choice
        options: [demo, live]
        default: demo
      refresh_news:
        description: Fetch a new news snapshot for this build
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: internet-wanderer-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run data:refresh
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_news
      - run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          VITE_BASE_PATH: '${{ steps.pages.outputs.base_path }}/'
          VITE_CONTENT_MODE: "${{ inputs.content_mode || 'demo' }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
